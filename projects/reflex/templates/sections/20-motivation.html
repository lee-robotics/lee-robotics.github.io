<section id="motivation" data-nav="{{plain:motivation.heading}}" class="content-section" aria-labelledby="intuition-title">
  <div class="section-head"><h2 id="intuition-title">{{motivation.heading}}</h2></div>
  <p class="lead">{{motivation.intro}}</p>
  <p>{{motivation.robot-context}}</p>
  <div class="comparison-grid">
    <figure class="comparison-card"><div class="card-label"><strong>(a) Without reflex</strong></div><video autoplay muted loop playsinline preload="metadata" width="1280" height="720" poster="assets/ik-poster.webp" aria-label="Without reflex: orange robot shows joint-position commands; the frame shows the end-effector task-space command."><source src="assets/comparison-ik.mp4" type="video/mp4"></video></figure>
    <figure class="comparison-card ours"><div class="card-label"><strong>(b) With reflex</strong></div><video autoplay muted loop playsinline preload="metadata" width="1280" height="720" poster="assets/reflex-poster.webp" aria-label="With reflex: orange robot shows joint-position commands; the frame shows the end-effector task-space command."><source src="assets/comparison-reflex.mp4" type="video/mp4"></video></figure>
  </div>
  <p class="comparison-caption">{{motivation.comparison-caption}}</p>
</section>
